[project]
name = "askhype-backend"
version = "0.1.0"
description = "FastAPI backend foundation for AskHype."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6,<0.116.0",
    "google-genai>=2.13,<3",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic-settings>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=9.0.0,<10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "scripts*"]
namespaces = false
